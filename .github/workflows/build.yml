name: Build Buds3 Pro EQ APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: unzip -o Buds3ProStudioEQ_HMS13_Android_Project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: Buds3ProStudioEQ_HMS13_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: Buds3ProStudioEQ_HMS13_Android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
